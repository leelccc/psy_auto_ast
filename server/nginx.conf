# WebSocket 连接升级变量定义（Console 需要）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP :80 — 域名跳 HTTPS；IP / 其他 Host 保持 HTTP（兼容旧 APK 直连 47.96.89.215）
server {
    listen 80;
    server_name maxpeking.top;
    return 301 https://$host$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /apk/ {
        alias /opt/psy_auto_ast/apk/;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100m;
    }
}

# HTTPS :443
server {
    listen 443 ssl;
    server_name maxpeking.top;

    ssl_certificate /etc/letsencrypt/live/maxpeking.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maxpeking.top/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /apk/ {
        alias /opt/psy_auto_ast/apk/;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }
    # MinIO 路径代理（C 方案）：录音/附件经 443 同源路径暴露，复用现有证书
    # location 不带尾部斜杠，避免 S3 bucket 级请求（如 /psy-auto-ast?location=）被 301 破坏签名
    location /psy-auto-ast {
        proxy_pass http://minio:9000/psy-auto-ast;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin "https://maxpeking.top" always;
        add_header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, x-amz-date, x-amz-content-sha256, x-amz-security-token" always;
        client_max_body_size 500m;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100m;
    }
}
# MinIO HTTPS on :9000 (B 方案：同域名不同端口，复用现有 maxpeking.top 证书) — 保留作兼容/备用
server {
    listen 9000 ssl;
    server_name maxpeking.top;

    ssl_certificate     /etc/letsencrypt/live/maxpeking.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maxpeking.top/privkey.pem;

    client_max_body_size 500m;
    proxy_request_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://maxpeking.top";
            add_header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, x-amz-date, x-amz-content-sha256, x-amz-security-token";
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
        add_header Access-Control-Allow-Origin "https://maxpeking.top" always;
        add_header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, x-amz-date, x-amz-content-sha256, x-amz-security-token" always;

        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}

# MinIO Console HTTPS on :9443（管理控制台，复用证书，反代到容器 9001 HTTP console）
server {
    listen 9443 ssl;
    server_name maxpeking.top;

    ssl_certificate /etc/letsencrypt/live/maxpeking.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maxpeking.top/privkey.pem;

    client_max_body_size 500m;
    proxy_request_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    location / {
                auth_basic "MinIO Console";
        auth_basic_user_file /etc/nginx/secrets/.minio_console_htpasswd;
                proxy_set_header Authorization "";
        proxy_pass http://minio:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }
}
